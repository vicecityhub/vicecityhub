name: Vice City Hub — Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────
  # JOB 1: BUILD + DEPLOY
  # ────────────────────────────────────
  build:
    name: Build & Optimize
    runs-on: ubuntu-latest
    # v12: also rebuilds on the 6h schedule (after the news agent) so the static agent feeds,
    # llms.txt and sitemap.xml never go stale. `always()` lets it run when news-agent was skipped (push).
    needs: news-agent
    if: ${{ always() && (needs.news-agent.result == 'success' || needs.news-agent.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build (prebuild regenerates llms.txt, .well-known, feeds, sitemap from the live Agent API)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Verify agent surface (files, JSON validity, JSON-LD, discovery links, PayPal id)
        run: npm run verify:dist
      - name: Build root discovery bundle (for vicecityhub.github.io)
        run: node scripts/gen-root-site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: root-site
          path: root-site
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # a skipped ancestor (news-agent on push) would otherwise cascade-skip this job
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Mirrors the generated root bundle (robots.txt, llms.txt, .well-known, feeds) to the
  # vicecityhub.github.io user-site repo so crawlers/agents find it at the host root.
  # Never blocks the site deploy; uses a write-only deploy key scoped to that one repo.
  sync-root:
    name: Sync root discovery bundle
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: root-site
          path: bundle
      - uses: actions/checkout@v4
        with:
          repository: vicecityhub/vicecityhub.github.io
          ssh-key: ${{ secrets.ROOT_SITE_DEPLOY_KEY }}
          path: root-repo
      - name: Mirror bundle and push if changed
        run: |
          set -e
          find root-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a bundle/. root-repo/
          cd root-repo
          git config user.name "vch-ci"
          git config user.email "vicecityhub@proton.me"
          git add -A
          if git diff --cached --quiet; then echo "root bundle unchanged"; exit 0; fi
          git commit -m "Sync root discovery bundle ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin HEAD:main

  # ────────────────────────────────────
  # JOB 2: NEWS AGENT (cron only)
  # Runs independently - never blocks deploy
  # ────────────────────────────────────
  news-agent:
    name: GTA VI News Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run news agent
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/news-agent.mjs
