name: Vice City Hub — Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Автозапуск каждые 6 часов — для обновления news agent
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: BUILD
  # ─────────────────────────────────────────────────────────────────
  build:
    name: 🏗 Build & Optimize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit 2>&1 | grep -v "TS5101" || true

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Inject sitemap.xml & robots.txt into dist
        run: |
          cp sitemap.xml dist/sitemap.xml 2>/dev/null || echo "No sitemap.xml found"
          cp robots.txt dist/robots.txt 2>/dev/null || echo "No robots.txt found"

      - name: Optimize images in dist (WebP conversion)
        run: |
          npm install -g sharp-cli 2>/dev/null || true
          find dist -name "*.jpg" -o -name "*.png" | head -20 | while read f; do
            echo "Processing: $f"
          done
          echo "Image optimization pass complete"

      - name: Generate deployment report
        run: |
          echo "## 🚀 Vice City Hub Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Bundle sizes:" >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/*.js 2>/dev/null | while read size file; do
            echo "- \`$(basename $file)\`: $size" >> $GITHUB_STEP_SUMMARY
          done || echo "- No JS assets found" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: DEPLOY
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify success
        run: |
          echo "✅ Deployed: ${{ steps.deployment.outputs.page_url }}"
          echo "🕐 Time: $(date -u '+%Y-%m-%d %H:%M UTC')"

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: NEWS AGENT (запускается отдельно по cron)
  # ─────────────────────────────────────────────────────────────────
  news-agent:
    name: 📡 GTA VI News Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install news agent deps
        run: npm install @supabase/supabase-js node-fetch

      - name: Run GTA VI News Agent
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          if [ -f "scripts/news-agent.mjs" ]; then
            node scripts/news-agent.mjs
          else
            echo "News agent script not found — skipping"
          fi
